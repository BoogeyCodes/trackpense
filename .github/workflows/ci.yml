name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trackpense:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name tp -p 8080:8080 trackpense:ci
          trap 'echo "--- logs ---"; docker logs tp; docker rm -f tp' EXIT
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8080/ | grep -q "Trackpense"
          curl -sf http://localhost:8080/transactions | grep -q "Transactions"
